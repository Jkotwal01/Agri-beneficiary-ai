# Only MailHog — PostgreSQL runs on your local machine.
# Start with: docker compose up -d
# Web UI: http://localhost:8025
# SMTP:    localhost:1025
services:
  mailhog:
    image: mailhog/mailhog
    container_name: agri_mailhog
    restart: always
    ports:
      - "1025:1025"   # SMTP port (backend EMAIL_BACKEND=smtp points here)
      - "8025:8025"   # Web UI for reading outgoing emails
