name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Ruff and Black
      run: |
        cd backend
        ruff check .
        black --check .
        
    - name: Run pytest
      env:
        DATABASE_URL: postgresql+psycopg2://agri:agri@localhost:5432/agri_test
        JWT_SECRET: test-secret
      run: |
        cd backend
        pytest
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run frontend lint
      run: |
        cd frontend
        npm run lint
        
    - name: Run frontend tests
      run: |
        cd frontend
        npm run test -- --run
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
